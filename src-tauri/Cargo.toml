[package]
name = "family-computing"
version = "0.1.0"
description = "Claude Code の家族が働く様子を見せ、注文を出すアプリ"
authors = ["konaito"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "family_computing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
tauri-plugin-clipboard-manager = "2"
# 2つ目の起動を止める（#176）。2.5 は tauri 2.12 以上が要る
tauri-plugin-single-instance = "2.5"
libc = "0.2"
portable-pty = "0.9.0"
vt100 = "0.18"
tauri-plugin-dialog = "2"

# 開発版の確認用に、アプリの中から NSApp のメニューを読んで押す（menu.rs の dev_ctl、FC_MENU_CTL）。版と機能は muda が使うものに合わせる
# お便りの通知を NSUserNotificationCenter に出し、押された知らせを delegate で受ける（notify_mac.rs、#330）。NSDictionary と NSUserNotification はそのため
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSUserNotification"] }

[dev-dependencies]
# メニューのキー（accelerator）が読めるかを試験で確かめる（menu.rs）。tauri は muda の Accelerator を外に出していない。版は tauri が使うものに合わせる
muda = { version = "0.20", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
